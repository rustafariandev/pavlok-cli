[package]
name = "pavlok-cli"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.103"
clap = { version = "4.6.1", features = ["derive", "env"] }
directories = "6.0.0"
reqwest = { version = "0.13.4", default-features = false, features = ["json", "rustls", "http2", "charset"] }
rmcp = { version = "2.1.0", features = ["server", "macros", "transport-io"] }
rpassword = "7.5.4"
schemars = "1.2.1"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
tokio = { version = "1.52.3", features = ["rt-multi-thread", "macros"] }
toml = "1.1.2"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
