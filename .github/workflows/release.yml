name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-*"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  create-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/create-gh-release-action@v1
        with:
          title: $version
          changelog: CHANGELOG.md
          token: ${{ secrets.GITHUB_TOKEN }}

  upload-assets:
    needs: create-release
    permissions:
      contents: write
    strategy:
      # One broken target should not cancel the others; a missing asset can be
      # uploaded afterwards without redoing the tag.
      fail-fast: false
      matrix:
        include:
          # musl rather than gnu: a gnu binary built on the runner image
          # requires that image's glibc or newer, which excludes Debian 12,
          # RHEL 9 and Ubuntu 22.04. Static musl runs anywhere. This is only
          # cheap because TLS uses ring rather than aws-lc-rs.
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
          # Built from the arm64 runner; the macOS SDK is universal. Intel
          # macOS runners are retired, so there is no x86_64 runner row.
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      # ring needs a C compiler targeting musl (x86_64-linux-musl-gcc), which
      # the runner image does not ship. This installs it so plain cargo can
      # build both musl targets; without it the build fails in cc-rs.
      - uses: taiki-e/setup-cross-toolchain-action@v1
        if: startsWith(matrix.os, 'ubuntu')
        with:
          target: ${{ matrix.target }}
      - uses: taiki-e/upload-rust-binary-action@v1
        with:
          bin: pavlok-cli
          target: ${{ matrix.target }}
          archive: $bin-$tag-$target
          tar: unix
          zip: windows
          checksum: sha256
          include: README.md,LICENSE
          token: ${{ secrets.GITHUB_TOKEN }}
