name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    name: fmt + clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      # Catch a broken include/path-dependency here rather than at tag time.
      # `cargo package`, not `publish --dry-run`: the dry run resolves
      # pavlok-cli's dependency on pavlok-client against the registry, which
      # fails whenever the workspace is ahead of what is published.
      - run: cargo package --workspace --locked

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Windows is not optional: config.rs has cfg(unix)/cfg(not(unix))
        # branches for write_private and the 0600/0700 permission handling, so
        # the Windows branch is never type-checked on Linux. macOS covers the
        # other cfg(unix) paths.
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.os }}
      - run: cargo test --workspace --locked
      - run: cargo build --locked --bin pavlok-cli

  msrv:
    name: msrv (1.88)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Must match rust-version in [workspace.package]. The floor comes from
      # darling (via schemars derive), not from edition 2024's 1.85.
      - uses: dtolnay/rust-toolchain@1.120
      - uses: Swatinem/rust-cache@v2
        with:
          key: msrv
      - run: cargo check --workspace --all-targets --locked
